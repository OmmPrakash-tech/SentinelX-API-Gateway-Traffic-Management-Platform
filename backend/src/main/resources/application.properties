spring.application.name=sentinelx
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/sentinelx}
spring.datasource.username=${DATABASE_USER:sentinelx_app}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=16
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=1MB
server.max-http-request-header-size=16KB
sentinel.seed=${DEMO_SEED:false}
sentinel.reset-directory=${RESET_DIRECTORY:}
sentinel.allowed-hosts=${UPSTREAM_HOSTS:localhost,127.0.0.1,user-service,user-service-2,product-service,order-service}
sentinel.demo-host=${DEMO_HOST:localhost}
sentinel.health-interval=3000
logging.structured.format.console=ecs

